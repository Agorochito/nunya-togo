<!doctype html>
<html lang="fr-TG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#22684c">
<title>Nunya — Test onboarding</title>
<link rel="stylesheet" href="./onboarding.css">
<style>
  /* Minimal reset mirroring the main app */
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 14px; line-height: 1.5; color: #26382e; background: #f8f9f5; }
  button, input { font: inherit; }
  button { cursor: pointer; border: 0; background: none; color: inherit; -webkit-tap-highlight-color: transparent; }
  .test-controls { position: fixed; bottom: 16px; right: 16px; z-index: 2000; display: flex; gap: 8px; }
  .test-controls button { background: #236a4e; color: #fff; padding: 12px 18px; border-radius: 8px; font-size: 12px; font-weight: 600; min-height: 44px; }
</style>
</head>
<body>
  <div class="test-controls">
    <button onclick="NunyaOnboarding.start()">Relancer l'onboarding</button>
  </div>
  <!-- Inline data so the page works with file:// protocol -->
  <script src="./_test-onboarding-data.js"></script>
  <script src="./onboarding.js"></script>
  <script>NunyaOnboarding.start();</script>
</body>
</html>
