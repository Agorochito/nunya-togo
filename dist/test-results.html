<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test — Écran résultats</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="results-ui.css" />
  <style>
    .test-controls {
      position: fixed;
      bottom: 16px;
      right: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      z-index: 9999;
    }
    .test-controls button {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
    }
    .test-btn-0 { background: #2e7d32; }
    .test-btn-1 { background: #1565c0; }
    .test-btn-2 { background: #e65100; }
    .test-btn-close { background: #c62828; }
  </style>
</head>
<body>
  <div class="test-controls">
    <button class="test-btn-0" onclick="showLevel0()">Niveau 0 (Curieux)</button>
    <button class="test-btn-1" onclick="showLevel1()">Niveau 1 (Apprenti)</button>
    <button class="test-btn-2" onclick="showLevel2()">Niveau 2 (Explorateur)</button>
    <button class="test-btn-close" onclick="NunyaResultsUI.close()">Fermer</button>
  </div>

  <!-- inline data for file:// -->
  <script src="_test-results-data.js"></script>
  <!-- dependencies -->
  <script src="placement-mapping.js"></script>
  <script src="results-ui.js"></script>

  <script>
    function showLevel0() {
      NunyaResultsUI.close();
      NunyaResultsUI.show({
        level: 0,
        overall: 20,
        categoryScores: { algo: 15, web: 25, digital: 20 }
      });
    }

    function showLevel1() {
      NunyaResultsUI.close();
      NunyaResultsUI.show({
        level: 1,
        overall: 55,
        categoryScores: { algo: 50, web: 75, digital: 40 }
      });
    }

    function showLevel2() {
      NunyaResultsUI.close();
      NunyaResultsUI.show({
        level: 2,
        overall: 85,
        categoryScores: { algo: 80, web: 90, digital: 85 }
      });
    }
  </script>
</body>
</html>
