<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nunya · Relecture locale</title><style>body{font:16px/1.7 system-ui;max-width:700px;margin:40px auto;padding:20px;background:#f4f5ed;color:#203e2e}label{display:block;margin:20px 0}input,textarea,select,button{font:inherit;padding:12px;width:100%;box-sizing:border-box}button{background:#236a4e;color:white;border:0;border-radius:8px}</style><h1>Relecture pédagogique locale</h1><p>Outil d’équipe, sans publication ni compte administrateur. Le fichier exporté documente une vérification ; il n’accorde aucun rôle et ne valide pas automatiquement un cours.</p><form id="review"><label>Identifiant du contenu<input name="content_id" required></label><label>Nom du relecteur<input name="reviewer" required></label><label>URL de la source institutionnelle<input name="source_url" type="url" required></label><label>Portée vérifiée<textarea name="scope" required></textarea></label><label>Statut proposé<select name="status"><option>brouillon</option><option>correction demandée</option><option>relecture terminée</option></select></label><label>Corrections et limites<textarea name="notes"></textarea></label><button>Exporter la fiche de vérification</button></form><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();const data={...Object.fromEntries(new FormData(e.target)),checked_at:new Date().toISOString(),publication_authorized:false};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='nunya-relecture.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};</script></html>
