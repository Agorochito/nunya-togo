name: Quality
on: [push, pull_request]
jobs:
  static-and-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:content
      - run: npm run check:academy

      - run: npm run lint:content
      - run: npm run check:prereqs
      - run: npm run check:curriculum-links
      - run: npm run test:code
      - run: npm run build
